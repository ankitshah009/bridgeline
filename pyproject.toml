[project]
name = "bridgeline"
version = "0.1.0"
description = "Bridgeline: free tech training for SF affordable-housing residents (Mistral x Elastic)"
authors = [
    { name = "Ankit Shah", email = "ankshah.mail@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "elasticsearch>=9,<10",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mistralai>=3.7.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
]
